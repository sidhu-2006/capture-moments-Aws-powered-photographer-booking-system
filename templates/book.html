{% extends "base.html" %}

{% block content %}

<div class="card">

<h2>Book Photographer</h2>

<h3>{{ photographer.name }}</h3>

<p><b>Specialization:</b> {{ photographer.specialization }}</p>
<p><b>Location:</b> {{ photographer.location }}</p>
<p><b>Price:</b> ₹{{ photographer.price }}</p>

<form id="bookingForm">

<input type="hidden" id="photographer_id" value="{{ photographer.id }}">

<input 
type="text" 
id="name" 
placeholder="Your Name"
required
>

<input 
type="email" 
id="email" 
placeholder="Your Email"
required
>

<input 
type="text" 
id="phone" 
placeholder="Phone Number"
required
>

<input 
type="text" 
id="location" 
placeholder="Event Location"
required
>

<button type="submit">Confirm Booking</button>

</form>

</div>

<script>

document.getElementById("bookingForm").addEventListener("submit", function(e){

e.preventDefault();

fetch("/book", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
photographer_id: document.getElementById("photographer_id").value,
name: document.getElementById("name").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
location: document.getElementById("location").value
})
})
.then(response => response.json())
.then(data => {

alert(data.message);

window.location.href = "/bookings";

})
.catch(error => {
console.log("Error:", error);
});

});

</script>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h1>Available Photographers</h1>

{% for p in photographers %}

<div class="card">

<h2>{{ p.name }}</h2>

<p>📷 <b>Specialization:</b> {{ p.specialization }}</p>

<p>📍 <b>Location:</b> {{ p.location }}</p>

<p> <b>Price:</b> ₹{{ p.price }}</p>

<a href="/book_photographer?id={{ p.id }}">
<button>Book Photographer</button>
</a>

</div>

{% endfor %}

{% endblock %}

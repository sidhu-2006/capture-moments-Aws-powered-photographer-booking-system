<!DOCTYPE html>
<html>

<head>
<title>Login - Capture Moments</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
width:300px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

a{
display:block;
margin-top:10px;
text-decoration:none;
color:#007BFF;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form method="POST">

<input name="email" type="email" placeholder="Email" required>

<input name="password" type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<a href="/register">Create Account</a>

</div>

</body>

</html>

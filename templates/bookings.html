{% extends "base.html" %}

{% block content %}

<h1>Your Bookings</h1>

{% for booking in bookings %}

<div class="card">

<p><b>Photographer:</b> {{ booking.photographer_name }}</p>

<p><b>Name:</b> {{ booking.name }}</p>

<p><b>Email:</b> {{ booking.email }}</p>

<p><b>Phone:</b> {{ booking.phone }}</p>

<p><b>Location:</b> {{ booking.location }}</p>

</div>

{% endfor %}

{% endblock %}
